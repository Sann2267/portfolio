[project]
name = "portfolio"
version = "0.1.0"
description = "Python-first interactive detective-room portfolio: cloud, DevOps, backend, data, and IoT case files"
requires-python = ">=3.12"
readme = "README.md"

[tool.vercel]
# Vercel's Python runtime detects Flask from requirements.txt; the entry point is
# declared here rather than through an api/index.py rewrite (see docs/ARCHITECTURE.md).
entrypoint = "wsgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q --strict-markers --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "docs", "content"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
