[project]
name = "portfolio"
version = "0.1.0"
description = "Python-first interactive detective-room portfolio: cloud, DevOps, backend, data, and IoT case files"
requires-python = ">=3.12"
readme = "README.md"
# Keep in sync with requirements.txt (a test enforces it). Vercel installs from this list when
# a pyproject.toml exists; pip and Docker use requirements.txt.
dependencies = [
    "Flask>=3.1.0",
    "Jinja2>=3.1.4",
    "PyYAML>=6.0.2",
    "pydantic>=2.9.0",
    "Markdown>=3.7",
    "python-dotenv>=1.0.1",
    "gunicorn>=23.0.0",
]

[tool.vercel]
# Vercel's Python runtime detects Flask from the dependencies; the entry point is
# declared here rather than through an api/index.py rewrite (see docs/ARCHITECTURE.md).
entrypoint = "wsgi:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q --strict-markers --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "docs", "content"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
