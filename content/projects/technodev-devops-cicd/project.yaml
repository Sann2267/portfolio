highlights:
  - >-
    Two self-hosted GitHub Actions runners on EC2 (Ubuntu 24.04, t3.medium) in private subnets
    across two Availability Zones, administered only through Session Manager, with outbound
    access through a NAT Gateway.
  - >-
    Four least-privilege security groups: runners self-referencing, Lambda outbound-only, RDS
    on port 5432 only from the Lambda and runner groups, and a self-referencing default group.
  - >-
    Four containerised Lambda functions from ECR images (user-api, order-api, notif-worker,
    websocket-api) attached to the private subnets; a REST API with greedy {proxy+} resources and
    a WebSocket API with $connect, $disconnect, $default, and sendMessage routes.
  - >-
    Dead-letter queue created before the application queues; both queues redrive to it after
    three failed receives; the notification worker consumes SQS with batch size 10.
  - >-
    Database credentials moved from Lambda environment variables to Secrets Manager and fetched
    at runtime.
  - >-
    CI on pull requests (flake8, four Docker builds, handler import checks, frontend and schema
    checks); CD on merge to main (ECR push, Lambda image update, Amplify deployment, API smoke
    test).
challenges:
  - AWS CodePipeline and CodeBuild are unavailable in the Learner Lab.
  - Runners without public IPs still need to reach GitHub, ECR, and package repositories.
  - Failed messages must not be lost and the database must never be reachable from the internet.
solutions:
  - GitHub Actions with self-hosted runners registered from inside the VPC.
  - Private subnets with a NAT Gateway for egress and Session Manager for administration.
  - SQS dead-letter queue with 14-day retention and redrive policies; RDS Multi-AZ, encrypted, private, in a subnet group spanning both private subnets.
