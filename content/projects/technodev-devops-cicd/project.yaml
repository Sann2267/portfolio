summary: >-
  A CI/CD platform for four containerised Lambda microservices, built inside a private VPC
  because managed CI/CD services are unavailable in the lab. GitHub Actions run on self-hosted
  EC2 runners in private subnets, images go to ECR, REST and WebSocket API Gateways expose the
  functions, and CloudWatch, VPC Flow Logs, Secrets Manager, and Cognito cover observability and
  security.
