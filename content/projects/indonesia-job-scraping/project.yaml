status: active
role: Sole developer. Pipeline design, extraction, OCR, cleaning, tests.
context: >-
  Personal project. Runs locally, no login and no access-control bypass. Its output feeds the
  Job Listing Dashboard (case 002).
period:
  start: 2026-08
  precision: month
  source: Reconnaissance verified live on 2026-08-11; still maintained.
summary: >-
  A local Python pipeline that collects publicly visible Instagram job-vacancy posts across
  Indonesia's 38 provinces, reads the flyer images with OCR, extracts and normalises the vacancy
  fields, deduplicates within and across runs, and stores structured output as JSON, JSON Lines,
  CSV, and SQLite.
technologies:
  - Python
  - curl_cffi
  - pydantic
  - RapidOCR
  - ONNX Runtime
  - SQLite
  - JSON
  - JSON Lines
  - CSV
  - YAML
  - Regular expressions
  - Groq API
  - pytest
  - Web scraping
  - OCR
  - Makefile
aws_services: []
highlights:
  - >-
    HTTP-only collection with browser TLS impersonation (curl_cffi, chrome124 profile). No login,
    no CAPTCHA or access-control bypass, and a robots.txt notice with warn, enforce, and ignore
    modes.
  - >-
    Nine-stage pipeline (discovery, fetch, parse, date filter, classify, OCR, normalise,
    deduplicate, store) with one module per stage and a per-stage entry point for offline
    debugging.
  - >-
    37-field pydantic output schema with extra="forbid". Unextractable fields stay null, which a
    dedicated "nothing is fabricated" test enforces.
  - >-
    Three-key deduplication (post id, canonical URL, content hash) applied within a run and
    across runs through a SQLite index.
  - >-
    Cleaning stage reads each post with a small LLM on Groq's free tier, validates every number
    and e-mail digit-for-digit against the source text, and falls back to regex extractors when
    no model can answer.
challenges:
  - Instagram's search and hashtag endpoints are login-walled, so keyword search is impossible for an anonymous client.
  - Flyer text lives in images, and the default OCR model dropped the spaces between Latin-script words.
  - Regex extraction mistook headings and slogans ("We Are Hiring") for job titles and employers.
  - Endpoint behaviour changed twice (login walls on 2026-08-12 and 2026-09-04), shrinking anonymous reach.
solutions:
  - Account-based discovery. Curated seed accounts per province plus username templates, each verified anonymously; 82 accounts across 37 of 38 provinces.
  - RapidOCR with the English PP-OCRv4 recogniser plus vocabulary-based re-spacing. Raw OCR text is always preserved next to the parsed fields.
  - An LLM reader with strict validation against the source text and a phone gate that routes rows without a mobile number to a review file.
  - A fail-loud error taxonomy. A 404 is per-input, a 403 or login redirect is terminal by policy, an unexpected JSON shape stops the run. Fallback to the signed-out profile surface when the feed endpoint closed.
results:
  - {text: "314 offline tests using trimmed real API responses as fixtures.", basis: code}
