aws_services: []
highlights:
  - >-
    The API never runs the scraper. Clicking "Run" writes a queued row; a worker on the machine
    that has the tools claims it with a conditional UPDATE, runs the subprocess, and streams
    state, log lines, and a heartbeat back into the same Postgres database.
  - >-
    The corpus stays read-only everywhere. Locally the API opens the scraper's SQLite with
    mode=ro; the deployed API reads a Postgres copy that the worker refreshes after every scrape
    with incremental upserts.
  - >-
    One filter definition is shared by the job list, statistics, and analytics endpoints, so
    every chart describes exactly the rows on screen.
  - >-
    Post images are served through a cache proxy and an S3-compatible bucket with presigned
    URLs, because Instagram CDN URLs expire within days.
  - >-
    AI features are a separate layer with a mock provider for tests and per-user daily caps.
    Without a key the features report themselves as unconfigured and the rest of the app is
    unaffected.
challenges:
  - Vercel functions are capped at 300 seconds, so scrapes, enrichment, and syncs cannot live in the API.
  - A deployed API has no access to the scraper's SQLite file or its multi-gigabyte image cache.
  - Neon's transaction pooler breaks psycopg's automatic prepared statements.
  - The scraper may be writing to its database while the API reads it.
solutions:
  - Queue-and-worker split with conditional claims, a stop flag the worker polls, self-marking of aborted jobs on restart, and a scheduled-task supervisor that restarts the worker.
  - A resumable migration script plus post-scrape sync to Postgres; the worker uploads images to the bucket and the API redirects to them.
  - The engine disables prepared statements for any pooled connection URL.
  - SQLite opened with mode=ro so the driver, not the code, refuses writes.
