summary: >-
  A FastAPI and React dashboard over the scraped job corpus. The API serves the corpus
  read-only with a per-user layer for saved jobs, an admin operations page queues scraper runs
  for a worker process that reports progress back through the database, and an optional AI
  layer answers questions over the same filtered data.
