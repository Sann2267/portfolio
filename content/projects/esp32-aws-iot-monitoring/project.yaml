title: ESP32 + AWS IoT Monitoring
aliases: [Smart IoT Environment Monitoring, Sistem IoT Cerdas, Monitoring Suhu dan Kelembapan]
category: iot
domains: [iot, cloud]
project_type: Real-time environment telemetry with a cloud dashboard
status: completed
role: >-
  IoT developer in a project team. Sensor wiring, ESP32 firmware, AWS IoT Core thing,
  certificate and policy setup, Node-RED flow and dashboard. The presentation is credited to
  "Tim Proyek IoT".
context: >-
  Team project presented to teachers and documented in a 13-slide deck. The firmware and cloud
  configuration were implemented but never published.
period:
  start: 2026-05
  end: 2026-06
  precision: month
  source: Related repositories were created in May and June 2026; the presentation is undated.
summary: >-
  An ESP32 reads temperature and humidity from a DHT22 and publishes JSON over MQTT to AWS IoT
  Core, authenticated with an X.509 device certificate over TLS. Node-RED subscribes to the
  topic, applies the data logic, and renders gauges, a 24-hour trend, and threshold alerts on a
  dashboard that is reachable from anywhere.
technologies:
  - ESP32
  - DHT22
  - Wi-Fi
  - C++ (Arduino)
  - Arduino IDE
  - MQTT
  - X.509 certificates
  - TLS
  - Node-RED
  - Node-RED Dashboard
  - JSON
aws_services:
  - AWS IoT Core
  - AWS IAM
highlights:
  - Data flow sensor, ESP32, Wi-Fi, AWS IoT Core, Node-RED, dashboard, with JSON payloads over MQTT.
  - Device authentication with an X.509 certificate and TLS between the ESP32 and AWS IoT Core; an AWS IoT policy restricts the device to its own topics; MQTT QoS covers delivery reliability.
  - Dashboard with gauges for instant readings, a 24-hour trend chart, and colour alerts when the temperature passes a threshold such as 30 °C.
  - >-
    Motivation from the deck: energy efficiency through automatic cooling decisions, protecting
    computer labs and servers from overheating, cloud access without geographic limits, and
    real-time analysis.
challenges:
  - A microcontroller on a school network has to authenticate to a cloud broker without shipping shared passwords.
  - Readings must reach a browser dashboard in real time from anywhere, not only on the local network.
solutions:
  - Per-device X.509 certificate and private key on the ESP32, TLS to the IoT Core endpoint, and a scoped IoT policy.
  - Node-RED subscribed to the IoT Core topic feeds gauges, charts, and alert nodes on the dashboard.
results:
  - text: The presentation reports stable monitoring with a transmission delay under one second on AWS infrastructure.
    basis: source
    note: Reported in the project deck; no measurement log was kept.
  - text: Firmware, the IoT Core thing, certificate, and policy, and the Node-RED flow were implemented but not documented beyond the deck.
