highlights:
  - >-
    Dual-VPC design in us-east-1: an application VPC (10.10.0.0/16) with EKS, an ALB, and
    Grafana on ECS Fargate, peered with a data VPC (10.20.0.0/16) holding Aurora PostgreSQL
    Multi-AZ and ElastiCache Redis, for compute-to-data isolation.
  - >-
    Cross-region connectivity through Transit Gateway peering to a DR VPC (10.30.0.0/16) in
    us-west-2 with an Aurora Global Database replica and S3 cross-region replication.
  - >-
    Tenant isolation with Kubernetes namespaces tenant-alpha and tenant-beta, restricted Pod
    Security Standards, ResourceQuota, NetworkPolicy (ingress from the same namespace and
    kube-system; egress to DNS, the data VPC, and HTTPS), and an HPA.
  - >-
    Event-driven audit trail: the Flask API publishes user CRUD events to Kinesis, a Lambda
    forwards them to a custom EventBridge bus, which fans out to SNS, SQS with a dead-letter
    queue, and a DynamoDB audit log with TTL.
  - >-
    Blue/green canary through CodeDeploy: 10% of traffic for five minutes, then 100%, with
    automatic rollback on ALB health-check failure.
  - >-
    Automated DR trigger: a CloudWatch alarm on primary health starts an EventBridge rule and a
    Lambda that initiates the Aurora Global Database failover and notifies through SNS.
challenges:
  - Terraform modules, Kubernetes manifests, Helm values, Dockerfiles, application code, and Lambda functions all contained intentional bugs, and some resources were missing entirely.
  - Pods in the application VPC must reach Aurora and Redis in another VPC while remaining isolated per tenant.
  - The ALB must route paths to two services in two tenant namespaces.
  - Database credentials must never appear in plaintext.
solutions:
  - Bugs fixed inside modules/ only (main.tf untouched), with a versioned S3 backend for Terraform state.
  - VPC peering routes in both directions with DNS resolution, security groups scoped to the application CIDR, NetworkPolicy egress to 10.20.0.0/16.
  - AWS Load Balancer Controller with target groups for /api/* (port 8080) and / (port 3000).
  - Kubernetes Secret cloudtech-db-secret consumed through secretKeyRef; ConfigMap for Redis host and Grafana URL.
