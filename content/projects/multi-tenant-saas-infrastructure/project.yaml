summary: >-
  A multi-tenant SaaS platform on Amazon EKS across two regions: a dual-VPC design in Virginia
  separating application and data, namespace-isolated tenants with restricted Pod Security
  Standards and NetworkPolicy, an event-driven audit pipeline, Grafana on ECS Fargate,
  blue/green canary releases through CodeDeploy, and an Oregon standby with Aurora Global
  Database and S3 cross-region replication.
