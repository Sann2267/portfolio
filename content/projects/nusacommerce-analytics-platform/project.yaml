summary: >-
  A five-layer data platform: CSV batches land in S3 and user events stream through Kinesis;
  Glue, EMR, Step Functions, and EventBridge transform and orchestrate; Redshift, DynamoDB, and
  S3 store history, real-time metrics, and the lake; Lambda behind API Gateway serves five
  endpoints protected by WAF and API keys; a dashboard on Amplify shows GMV, sales, funnel, and
  ML segments.
