highlights:
  - >-
    Foundation in CloudFormation: three S3 buckets (versioned raw bucket with EventBridge
    notifications, SSE-S3, Block Public Access, 30-day Glacier and 120-day expiry lifecycle), a
    DynamoDB metrics table with composite key, 48-hour TTL, GSI and streams, a two-shard Kinesis
    stream, and a Firehose delivery stream with dynamic date partitioning and Parquet conversion.
  - >-
    Batch path: Glue database, four catalog tables, two crawlers, three Glue 4.0 ETL jobs writing
    partitioned Parquet, an Athena workgroup with a 1 GB scan cap and five named queries, and
    Redshift staging, analytics, and reporting schemas with a materialized daily summary.
  - >-
    Streaming path: Kinesis records consumed in batches of 100 by a Lambda that aggregates hourly
    GMV, order count, and active users into DynamoDB with atomic ADD operations.
  - >-
    Orchestration: a nine-state Step Functions machine (validate, parallel ETL, crawler, parallel
    Redshift load and EMR steps, ML load, notify) triggered by an EventBridge rule with an input
    transformer on S3 object creation. The provided definition contained five intentional bugs to
    find and fix.
  - >-
    Serving and security: five REST endpoints behind API keys and a usage plan (100 RPS, burst
    200, 1,000 requests per day), a WAF Web ACL with a rate-based rule returning a custom 429,
    the SQLi managed rule group, dead-letter queues with CloudWatch alarms, and Redshift
    credentials in Secrets Manager with a resource policy.
  - >-
    ML features on EMR 7.x: a seller composite score (GMV 40%, completion rate 30%, rating 20%,
    growth 10%, min-max scaled, tiers TOP, GROWING, STABLE, AT_RISK) and RFM user segmentation
    (z-score, NTILE quartiles, labels CHAMPION, LOYAL, AT_RISK, DORMANT), loaded into Redshift.
challenges:
  - The whole foundation had to be expressed as CloudFormation and updated in place as resources were added.
  - The Firehose Parquet conversion references a Glue table that does not exist until later, so the template cannot enable it up front.
  - The provided state-machine definition contained five bugs, some failing validation and some only at runtime.
  - Public API endpoints needed protection without breaking the dashboard.
solutions:
  - Incremental stack updates on one template with PascalCase logical IDs and nusa- physical names.
  - Format conversion enabled manually after the Glue catalog table was defined.
  - Fixes located through the Step Functions console errors and execution history, then a manual test execution to SUCCEEDED.
  - API keys with a usage plan as the baseline, WAF layered on the prod stage with rate limiting blocking and common rules in count mode.
