# Controlled vocabulary for the whole site.
# - categories: case categories and filter values
# - groups: how technologies are grouped in badges and the skills page
# - technologies: every name a project may use; aliases map to the canonical name

categories:
  - id: cloud
    label: Cloud
    description: AWS infrastructure, networking, and managed services
  - id: devops
    label: DevOps
    description: CI/CD, automation, containers, and delivery pipelines
  - id: backend
    label: Backend
    description: APIs, services, workers, and data access
  - id: data
    label: Data
    description: Scraping, ETL, analytics, and data platforms
  - id: iot
    label: IoT
    description: Sensors, microcontrollers, MQTT, and device dashboards
  - id: fullstack
    label: Fullstack
    description: Backend plus a user-facing frontend

groups:
  - {id: language, label: Languages}
  - {id: framework, label: Frameworks and libraries}
  - {id: aws, label: AWS services}
  - {id: infrastructure, label: Infrastructure and IaC}
  - {id: container, label: Containers and orchestration}
  - {id: data, label: Data and analytics}
  - {id: database, label: Databases and storage}
  - {id: messaging, label: Messaging and streaming}
  - {id: security, label: Security}
  - {id: observability, label: Observability}
  - {id: frontend, label: Frontend}
  - {id: iot, label: IoT hardware and protocols}
  - {id: tooling, label: Tooling and platforms}
  - {id: ai, label: AI and ML}

